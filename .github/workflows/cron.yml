name: Laptop watcher

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # needed to commit state.db back

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python watcher.py --once

      - name: Commit updated state.db
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(state): update state.db [skip ci]"
          file_pattern: state.db
          commit_user_name: laptop-watcher-bot
          commit_user_email: actions@github.com
