name: Laptop watcher

on:
  schedule:
    # Twice daily — 13:00 UTC and 01:00 UTC.
    # Eastern Time: 09:00 / 21:00 EDT (08:00 / 20:00 EST).
    - cron: "0 13,1 * * *"
  workflow_dispatch:

permissions:
  contents: write   # needed to commit state.db back

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUTF8: "1"
        run: python watcher.py --once

      - name: Commit updated state.db
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(state): update state.db [skip ci]"
          file_pattern: state.db
          commit_user_name: laptop-watcher-bot
          commit_user_email: actions@github.com
